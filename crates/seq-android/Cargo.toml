[package]
name = "seq-android"
edition.workspace = true
version.workspace = true
license.workspace = true

# Library loaded by the GameActivity (android/app): libseq_android.so.
# Empty outside Android.
[lib]
name = "seq_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
sequensss = { path = "../seq-app" }
eframe = { workspace = true, features = ["android-game-activity"] }
winit = { version = "0.30", features = ["android-game-activity"] }
android_logger = "0.14"
log = "0.4"
