name: Release

# Stable: pushing a vX.Y.Z tag (or creating the release on GitHub) builds the desktop
# binaries and attaches them to the release.
# Beta: run this workflow by hand with a version (gh workflow run release.yml -f
# version=0.1.5-beta.2): it builds the `beta` tag and replaces the files of the single
# `beta` pre-release, whose link never changes.
# The Android APK is signed and uploaded by hand (the key stays out of CI).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version embedded in the binaries, e.g. 0.1.5-beta.2"
        required: true

permissions:
  contents: write

# The version is embedded in the binaries through SEQUENSSS_VERSION. A version with a
# suffix (0.1.5-beta.2) is published as a pre-release, which the app's update check and
# the README badge ignore.
env:
  SEQUENSSS_VERSION: ${{ inputs.version || github.ref_name }}
  RELEASE_TAG: ${{ inputs.version && 'beta' || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && 'beta' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # Same cache key as the CI test job on Linux, so a tag reuses what main already built.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-latest
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev
      - run: cargo test --workspace

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && 'beta' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sequensss
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sequensss.exe dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Sequensss-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.SEQUENSSS_VERSION, '-') }}
          files: Sequensss-windows-x64.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && 'beta' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: ./build-macos.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.SEQUENSSS_VERSION, '-') }}
          files: dist/Sequensss-macos.zip

  linux:
    needs: test
    runs-on: ubuntu-22.04   # glibc 2.35: works on most recent distributions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && 'beta' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev
      - run: cargo build --release -p sequensss
      - run: |
          mkdir -p Sequensss-linux-x64
          cp target/release/sequensss LICENSE Sequensss-linux-x64/
          tar -czf Sequensss-linux-x64.tar.gz Sequensss-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.SEQUENSSS_VERSION, '-') }}
          files: Sequensss-linux-x64.tar.gz
